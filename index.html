<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIウミガメのスープ</title>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1e293b;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --success: #34d399;
    --danger: #f87171;
    --warn: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; position: relative; }

  /* ========== Loading Screen ========== */
  #loading {
    position: absolute; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1), visibility 0.8s;
  }
  #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .turtle-logo {
    font-size: 64px; margin-bottom: 8px;
    animation: turtleFloat 3s ease-in-out infinite;
  }
  @keyframes turtleFloat {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }

  .app-title {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .app-subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 32px; }

  .progress-wrap { width: 100%; max-width: 360px; }

  .progress-bar-track {
    width: 100%; height: 10px;
    background: var(--surface2); border-radius: 99px; overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
    position: relative;
  }
  .progress-bar-fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .progress-text { font-size: 28px; font-weight: 700; color: var(--accent); }
  .progress-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .tutorial-card {
    margin-top: 32px; max-width: 360px; width: 100%;
    background: var(--surface); border: 1px solid rgba(56,189,248,0.2);
    border-radius: 16px; padding: 20px; text-align: left;
    animation: fadeSlideUp 0.6s ease both;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tutorial-card h3 { font-size: 14px; color: var(--accent); margin-bottom: 10px; }
  .tutorial-card li {
    font-size: 12px; color: var(--text-dim); margin-bottom: 6px;
    padding-left: 16px; position: relative; list-style: none;
  }
  .tutorial-card li::before {
    content: '▸'; position: absolute; left: 0; color: var(--accent2);
  }

  .loading-tips {
    margin-top: 20px; font-size: 11px; color: var(--text-dim);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ========== Chat Area ========== */
  #chat-area {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  .msg {
    max-width: 85%; padding: 12px 16px; border-radius: 18px;
    font-size: 14px; line-height: 1.7; word-break: break-word;
    animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), #2563eb);
    color: #fff; border-bottom-right-radius: 6px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    border-bottom-left-radius: 6px;
  }
  .msg.system {
    align-self: center; text-align: center;
    background: transparent; color: var(--text-dim);
    font-size: 12px; max-width: 100%;
  }
  .msg .answer-tag {
    display: inline-block; font-weight: 700; padding: 1px 8px;
    border-radius: 6px; font-size: 13px; margin-bottom: 4px;
  }
  .answer-tag.yes { background: rgba(52,211,153,0.15); color: var(--success); }
  .answer-tag.no { background: rgba(248,113,113,0.15); color: var(--danger); }
  .answer-tag.irrelevant { background: rgba(251,191,36,0.15); color: var(--warn); }
  .answer-tag.unknown { background: rgba(148,163,184,0.15); color: var(--text-dim); }

  .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
  .typing-indicator span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim);
    animation: typing 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* ========== Input Area ========== */
  #input-area {
    padding: 10px 12px 14px;
    background: var(--surface);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 8px; align-items: flex-end;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  #input-area textarea {
    flex: 1; resize: none; border: 1px solid rgba(255,255,255,0.1);
    background: var(--surface2); color: var(--text);
    border-radius: 22px; padding: 10px 16px;
    font-size: 15px; font-family: inherit;
    max-height: 100px; line-height: 1.4;
    outline: none; transition: border-color 0.2s;
  }
  #input-area textarea:focus { border-color: var(--accent); }
  #input-area textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: none; cursor: pointer; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, opacity 0.2s;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ========== Header ========== */
  #header {
    padding: 12px 16px;
    background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }
  #header .h-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  #header .h-title span { font-size: 20px; }
  .reset-btn {
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim); border-radius: 10px; padding: 6px 14px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: background 0.2s, color 0.2s;
  }
  .reset-btn:hover { background: var(--surface); color: var(--text); }

  /* ========== Hidden ========== */
  .hidden { display: none !important; }

  /* ========== Safari WebGPU Banner ========== */
  #webgpu-banner {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: #7f1d1d; color: #fecaca; padding: 12px 16px;
    font-size: 12px; text-align: center; display: none;
  }

  @media (min-width: 768px) {
    .msg { max-width: 75%; font-size: 15px; }
    #chat-area { padding: 20px 24px; }
    #input-area { padding: 12px 20px 18px; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- Loading Screen -->
  <div id="loading">
    <div class="turtle-logo">🐢</div>
    <div class="app-title">AIウミガメのスープ</div>
    <div class="app-subtitle">AIが問題を作り、AIが答える水平思考クイズ</div>

    <div class="progress-wrap">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-pct">0%</div>
      <div class="progress-label" id="progress-label">モデルを準備中...</div>
    </div>

    <div class="tutorial-card">
      <h3>🎮 遊び方</h3>
      <ul>
        <li>AIが不可解な「問題」を出題します</li>
        <li>あなたは「はい / いいえ」で答えられる質問をします</li>
        <li>AIが「はい」「いいえ」「関係ありません」で回答</li>
        <li>真相を推理して、答えを入力してみよう！</li>
      </ul>
    </div>

    <div class="loading-tips" id="loading-tip">💡 ヒントを準備中...</div>
  </div>

  <!-- Header -->
  <div id="header" class="hidden">
    <div class="h-title"><span>🐢</span> AIウミガメのスープ</div>
    <button class="reset-btn" id="reset-btn">新しい問題</button>
  </div>

  <!-- Chat Area -->
  <div id="chat-area" class="hidden"></div>

  <!-- Input Area -->
  <div id="input-area" class="hidden">
    <textarea id="user-input" rows="1" placeholder="質問や答えを入力..." enterkeyhint="send"></textarea>
    <button class="send-btn" id="send-btn" aria-label="送信">➤</button>
  </div>
</div>

<div id="webgpu-banner"></div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.83";

// ============================================================
//  設定
// ============================================================
const MODEL_ID = "SmolLM2-135M-Instruct-q0f16-MLC";
const SYSTEM_PROMPT = `あなたは「ウミガメのスープ」のゲームマスターです。ルール:
- プレイヤーが「はい/いいえ」で答えられる質問をします。
- あなたは必ず次の4つのいずれかで答えてください: 「はい」「いいえ」「関係ありません」「答えられません」。
- 答えの前に必ず [[YES]] [[NO]] [[IRRELEVANT]] [[UNKNOWN]] のタグを付けてください。
- 余計な説明は一切しないでください。
- プレイヤーが真相を言い当てたら [[CORRECT]] と答えてください。`;

const TIPS = [
  "💡 モデルは約78MB。一度ダウンロードすれば次回から爆速です",
  "💡 質問は「はい」「いいえ」で答えられる形にしましょう",
  "💡 意外な事実が隠れているかも？ 常識を疑ってみよう",
  "💡 「関係ありません」と言われたら別の方向を考えよう",
  "💡 正解に近づくとAIの反応が変わります",
  "💡 答えが分かったら、そのまま入力してみよう！",
  "💡 Safari 26以降でWebGPUが使えます。設定→Safari→詳細で確認",
];

// ============================================================
//  DOM 参照
// ============================================================
const $ = (id) => document.getElementById(id);
const loadingEl = $("loading");
const progressBar = $("progress-bar");
const progressPct = $("progress-pct");
const progressLabel = $("progress-label");
const loadingTip = $("loading-tip");
const header = $("header");
const chatArea = $("chat-area");
const inputArea = $("input-area");
const userInput = $("user-input");
const sendBtn = $("send-btn");
const resetBtn = $("reset-btn");
const webgpuBanner = $("webgpu-banner");

// ============================================================
//  状態
// ============================================================
let engine = null;
let isLoading = false;
let isGenerating = false;
let currentPuzzle = null;
let conversationHistory = [];
let tipIndex = 0;
let tipInterval = null;

// ============================================================
//  UI ヘルパー
// ============================================================
function setProgress(pct, label) {
  progressBar.style.width = Math.min(100, Math.max(0, pct)) + "%";
  progressPct.textContent = Math.round(pct) + "%";
  if (label) progressLabel.textContent = label;
}

function showLoading() {
  loadingEl.classList.remove("hidden");
  header.classList.add("hidden");
  chatArea.classList.add("hidden");
  inputArea.classList.add("hidden");
}

function hideLoading() {
  loadingEl.classList.add("hidden");
  header.classList.remove("hidden");
  chatArea.classList.remove("hidden");
  inputArea.classList.remove("hidden");
  if (tipInterval) { clearInterval(tipInterval); tipInterval = null; }
}

function addMessage(text, role, answerTag) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (answerTag) {
    const tag = document.createElement("div");
    tag.className = "answer-tag " + answerTag;
    tag.textContent = answerTag === "yes" ? "はい" :
                      answerTag === "no" ? "いいえ" :
                      answerTag === "irrelevant" ? "関係ありません" :
                      "答えられません";
    div.appendChild(tag);
    div.appendChild(document.createElement("br"));
  }
  div.appendChild(document.createTextNode(text));
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function addSystemMessage(text) {
  const div = document.createElement("div");
  div.className = "msg system";
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg ai";
  div.id = "typing-msg";
  div.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function removeTyping() {
  const el = $("typing-msg");
  if (el) el.remove();
}

function autoResizeTextarea() {
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + "px";
}

function detectAnswerTag(text) {
  if (text.includes("[[YES]]") || text.includes("YES") || text.startsWith("はい")) return "yes";
  if (text.includes("[[NO]]") || text.includes("NO") || text.startsWith("いいえ")) return "no";
  if (text.includes("[[IRRELEVANT]]") || text.includes("関係ありません") || text.includes("関係ない")) return "irrelevant";
  if (text.includes("[[UNKNOWN]]") || text.includes("答えられません")) return "unknown";
  if (text.includes("[[CORRECT]]") || text.includes("正解")) return "yes";
  return null;
}

function cleanAnswerText(text) {
  return text.replace(/\[\[.*?\]\]/g, "").trim();
}

// ============================================================
//  WebGPU 検出
// ============================================================
async function checkWebGPU() {
  if (!navigator.gpu) {
    webgpuBanner.textContent = "⚠️ このブラウザはWebGPUに対応していません。Safari 26以降、またはChrome/Edgeをお使いください。";
    webgpuBanner.style.display = "block";
    return false;
  }
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      webgpuBanner.textContent = "⚠️ GPUアダプタが見つかりません。デバイスの設定を確認してください。";
      webgpuBanner.style.display = "block";
      return false;
    }
  } catch (e) {
    webgpuBanner.textContent = "⚠️ WebGPU初期化エラー: " + e.message;
    webgpuBanner.style.display = "block";
    return false;
  }
  return true;
}

// ============================================================
//  LLM 初期化
// ============================================================
async function initEngine() {
  if (isLoading) return;
  isLoading = true;

  setProgress(0, "WebGPUを確認中...");
  const hasGPU = await checkWebGPU();
  if (!hasGPU) {
    setProgress(0, "WebGPU未対応のため初期化を中止しました");
    isLoading = false;
    return;
  }

  setProgress(5, "モデルをダウンロード中...");

  try {
    engine = await webllm.CreateMLCEngine(MODEL_ID, {
      initProgressCallback: (report) => {
        const progress = report.progress || 0;
        const pct = Math.round(progress * 100);
        setProgress(pct, report.text || "読み込み中...");
        if (pct > 90) setProgress(100, "最終処理中...");
      },
    });

    setProgress(100, "準備完了！");
    await new Promise(r => setTimeout(r, 600));
    hideLoading();
    startNewGame();
  } catch (err) {
    console.error(err);
    setProgress(0, "エラー: " + err.message);
  } finally {
    isLoading = false;
  }
}

// ============================================================
//  ゲーム開始
// ============================================================
async function startNewGame() {
  if (isGenerating) return;
  isGenerating = true;
  chatArea.innerHTML = "";
  conversationHistory = [];

  addSystemMessage("新しい問題を生成中...");
  const typing = showTyping();

  try {
    const puzzlePrompt = `水平思考クイズの問題を1つ作成してください。必ず以下の形式で出力:
【問題】〇〇〇〇
【真相】〇〇〇〇
問題は短く、不可解な状況を描写してください。真相は論理的で、納得感のあるものにしてください。`;
    conversationHistory.push({ role: "system", content: SYSTEM_PROMPT });
    conversationHistory.push({ role: "user", content: puzzlePrompt });

    const reply = await engine.chat.completions.create({
      messages: conversationHistory,
      temperature: 0.9,
      max_tokens: 300,
    });

    const content = reply.choices[0].message.content;
    conversationHistory.push({ role: "assistant", content });

    removeTyping();
    const puzzleMatch = content.match(/【問題】([\s\S]*?)【真相】/);
    const truthMatch = content.match(/【真相】([\s\S]*)/);

    const puzzleText = puzzleMatch ? puzzleMatch[1].trim() : content;
    const truthText = truthMatch ? truthMatch[1].trim() : "";

    currentPuzzle = { puzzle: puzzleText, truth: truthText };

    addSystemMessage("問題が出題されました。質問をどうぞ！");
    addMessage("【問題】\n" + puzzleText, "ai");

    // 真相をコンテキストに追加
    conversationHistory.push({ role: "user", content: `この問題の真相は「${truthText}」です。プレイヤーの質問に答えてください。` });
    conversationHistory.push({ role: "assistant", content: "了解しました。プレイヤーの質問に「はい」「いいえ」「関係ありません」「答えられません」で答えます。" });

  } catch (err) {
    removeTyping();
    addSystemMessage("エラーが発生しました: " + err.message);
  } finally {
    isGenerating = false;
  }
}

// ============================================================
//  ユーザー入力送信
// ============================================================
async function handleSend() {
  const text = userInput.value.trim();
  if (!text || isGenerating) return;

  userInput.value = "";
  autoResizeTextarea();
  addMessage(text, "user");
  conversationHistory.push({ role: "user", content: text });

  isGenerating = true;
  sendBtn.disabled = true;
  const typing = showTyping();

  try {
    const reply = await engine.chat.completions.create({
      messages: conversationHistory,
      temperature: 0.3,
      max_tokens: 80,
    });

    const raw = reply.choices[0].message.content;
    conversationHistory.push({ role: "assistant", content: raw });

    removeTyping();
    const tag = detectAnswerTag(raw);
    const clean = cleanAnswerText(raw);

    if (tag === "yes" && (raw.includes("正解") || raw.includes("[[CORRECT]]"))) {
      addMessage("🎉 正解！\n" + (currentPuzzle ? "真相: " + currentPuzzle.truth : clean), "ai", "yes");
      addSystemMessage("「新しい問題」ボタンで次のゲームへ");
    } else {
      addMessage(clean || raw, "ai", tag);
    }
  } catch (err) {
    removeTyping();
    addMessage("エラー: " + err.message, "ai", "unknown");
  } finally {
    isGenerating = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

// ============================================================
//  イベントリスナー
// ============================================================
sendBtn.addEventListener("click", handleSend);
userInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
userInput.addEventListener("input", autoResizeTextarea);

resetBtn.addEventListener("click", () => {
  if (!engine || isGenerating) return;
  startNewGame();
});

// ヒントローテーション
function startTipRotation() {
  tipInterval = setInterval(() => {
    tipIndex = (tipIndex + 1) % TIPS.length;
    loadingTip.style.opacity = "0";
    setTimeout(() => {
      loadingTip.textContent = TIPS[tipIndex];
      loadingTip.style.opacity = "1";
    }, 300);
  }, 3500);
}

// ============================================================
//  起動
// ============================================================
showLoading();
startTipRotation();
initEngine();

// ページ離脱時にエンジンを解放
window.addEventListener("beforeunload", () => {
  if (engine) engine.unload();
});
</script>
</body>
</html>
